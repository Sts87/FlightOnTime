<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✈️ FlightOnTime | Predicción de retrasos de vuelos</title>

    <meta name="description" content="Homepage of FlightOnTime, Web App to predict flight delays.">
    <meta name="keywords" content="FlightOnTime, Prediction, Delays, Flights, Data Science">
    <meta name="author" content="FlightOnTime">

    <meta property="og:title" content="FlightOnTime | Frontend Developer">
    <meta property="og:description" content="Single-page web for predicting flight delays.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://flightontime.dev">

    <link rel="icon" href="./image/favicon.ico" type="image/png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <h1>✈️FlightOnTime</h1>
            <!-- <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="contact.html">Contacto</a></li>
            </ul> -->
        </nav>
    </header>
    
    <main class="content-home">
        <section class="prediction-form">
            <form id="flightForm" action="#" method="post">
                <h2>Predicción de retrasos de vuelos 🔮</h2>
                <!-- <label for="aeroline">Aerolinea:</label> -->
                <!-- <input type="text" id="aeroline" name="aeroline" required> -->
                
                <label for="airline">Aerolínea</label>
                <input
                    type="text"
                    id="airline"
                    name="aeroline"
                    list="airlines"
                    required
                />

                <datalist id="airlines">
                    <option value="AA">American Airlines</option>
                    <option value="DL">Delta Airlines</option>
                    <option value="UA">United Airlines</option>
                    <option value="WN">Southwest Airlines</option>
                    <option value="US">US Airways</option>
                    <option value="AS">Alaska Airlines</option>
                    <option value="B6">JetBlue</option>
                    <option value="HA">Hawaiian Airlines</option>
                    <option value="OO">SkyWest</option>
                    <option value="EV">ExpressJet</option>
                    <option value="XE">ExpressJet (XE)</option>
                    <option value="MQ">Envoy Air</option>
                    <option value="9E">Endeavor Air</option>
                    <option value="OH">PSA Airlines</option>
                    <option value="YV">Mesa Airlines</option>
                    <option value="FL">AirTran</option>
                    <option value="F9">Frontier Airlines</option>
                    <option value="CO">Continental Airlines</option>
                </datalist>

                
                <!-- <label for="origin">Origen:</label> -->
                <!-- <input type="text" id="origin" name="origin" required> -->
                <!-- <label for="destination">Destino:</label> -->
                <!-- <input type="text" id="destination" name="destination" required> -->
                
                <label for="origin">Origen</label>
                <input
                    type="text"
                    id="origin"
                    name="origin"
                    list="airports"
                    required
                />

                <label for="destination">Destino</label>
                <input
                    type="text"
                    id="destination"
                    name="destination"
                    list="airports"
                    required
                />

                <datalist id="airports">
                    <option value="ATL">Atlanta (ATL)</option>
                    <option value="JFK">New York (JFK)</option>
                    <option value="LAX">Los Angeles (LAX)</option>
                    <option value="ORD">Chicago (ORD)</option>
                    <option value="DFW">Dallas/Fort Worth (DFW)</option>
                    <option value="DEN">Denver (DEN)</option>
                    <option value="SFO">San Francisco (SFO)</option>
                    <option value="SEA">Seattle (SEA)</option>
                    <option value="MIA">Miami (MIA)</option>
                    <option value="LAS">Las Vegas (LAS)</option>
                    <option value="PHL">Philadelphia (PHL)</option>
                    <option value="PHX">Phoenix (PHX)</option>
                    <option value="SAN">San Diego (SAN)</option>
                    <option value="TPA">Tampa (TPA)</option>
                    <option value="ANC">Anchorage (ANC)</option>
                    <option value="MSP">Minneapolis (MSP)</option>
                    <option value="DTW">Detroit (DTW)</option>
                    <option value="BOS">Boston (BOS)</option>
                    <option value="EWR">Newark (EWR)</option>
                </datalist>

                
                <label for="date">Fecha de partida:</label>
                <input type="date" id="date" name="date" required>
                <label for="time">Hora de partida:</label>
                <input type="time" id="time" name="time" required>
                <!-- <label for="duration">Duración en minutos:</label> -->
                <!-- <input type="number" id="duration" name="duration" required> -->
                <label for="distance">Distancia en km:</label>
                <input type="number" id="distance" name="distance" required>
                <label for="csvFile">📄 Archivo CSV: (opcional)</label>
                <input 
                type="file" 
                id="csvFile" 
                name="csvFile" 
                accept=".csv"
                />
                <p class="hint">*Si subes un CSV, los campos manuales serán ignorados.</p>
                <!-- <br> -->
                <button type="submit">Consultar retraso</button>
                <!-- <div id="result"></div> -->
                <!-- <hr> -->
            </form>
        </section>
        <section id="result" class="results-panel">
            <!-- aquí se inyectan los resultados -->
        </section>
    </main>
    
    <footer>
        <p>© 2026 FlightOnTime</p>
    </footer>

    <script src="./script.js"></script>
</body>
</html>
