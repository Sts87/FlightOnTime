<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight On Time</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <h1>Flight On Time</h1>
    <form>
        <div class="form-group">
            <label for="origen">Aeropuerto origen</label>
            <input type="text" id="origen" name="origen" oninput="printDuracion()">
        </div>
        <div class="form-group">
            <label for="destino">Aeropuerto destino</label>
            <input type="text" id="destino" name="destino" oninput="printDuracion()">
        </div>
        <div class="form-group">
            <label for="duracion">Duración</label>
            <input type="number" id="duracion" name="duracion">
        </div>
    </form>
</body>
</html>
